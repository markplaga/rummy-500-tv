<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123c32" />
    <title>Rummy 500 Table</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <main class="boot-fallback">
        <h1>Rummy 500</h1>
        <p>Opening the table…</p>
      </main>
    </div>
    <noscript>This game requires JavaScript.</noscript>
    <script src="/src/vendor/qrcode.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script>
      const updateDiscardWording = () => {
        const note = document.querySelector('.discard-heading small');
        const button = document.querySelector('#take-discard');
        if (note) note.textContent = 'Only the top card is visible';
        if (button) button.textContent = 'Take top discard';
      };
      new MutationObserver(updateDiscardWording).observe(document.body, { childList: true, subtree: true });
      updateDiscardWording();
    </script>
  </body>
</html>
